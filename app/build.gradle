apply plugin: 'com.android.application'

android {
    ndkVersion "28.2.13676358"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        // Moonbeam 版本号：语义化 major.minor.patch
        //   versionCode = major*10000 + minor*100 + patch，保证单调递增且可读
        // 0.1.0  迁移（V+ 备份导入）+ 图标
        // 0.2.0  指标引擎 + HUD
        // 0.3.0  三档面板 + 遥测
        // 0.4.0  设置页六分类（画面/音频/延迟/输入/网络/调试）+ 常用/高级两层
        // 0.4.1  修 0.4.0 设置页必崩：新分类必须先挂到屏幕再往里放条目
        // 0.4.2  去掉二级"高级设置"页（弹窗遮状态栏），六分类扁平化，画面以 HDR 打头
        // 0.4.3  画面收纳 HDR 配置：亮度报告 + 手动峰值，开机探测并随 launch 上报
        // 0.4.4  亮度报告摘要分三行；设置页剩余英文全部资源化（含备份导入对话框）
        // 0.4.5  输入栏按触控/屏幕控件/手柄分段；一批含义不清的标题与说明重写
        // 0.5.0  本机 HDR 显示测试：内嵌亮度阶梯，用户标出最后一档可分辨的亮度并写回峰值
        // 0.5.1  测试页改全范围：资产重出 pc 版，播放换 MediaCodec 并显式设 KEY_COLOR_RANGE
        // 0.5.2  HDR 会话给窗口声明 COLOR_MODE_HDR；新增"HDR 用屏幕最高亮度"开关
        // 0.5.3  HDR 测试加二分查找：两patch对比，逐步收窄到面板真正的亮度上限
        // 0.5.4  修二分模式无法播放：pairs.mp4 段长算错（0.5s/段，总长 15.5s），seek 越界
        // 0.5.5  二分改为双画面 + 对数二分：100↔10000 nit 收敛到真峰值
        // 0.5.6  修二分渲染：档位片改全 I 帧 1fps，每块只开一次解码器，surface 就绪再画
        // 0.5.7  色块改为满宽条带，左右两块在中缝直接相接，便于直接比较
        // 0.5.8  二分逻辑修正：右块固定满亮度，左块测点；得到"最后一个还看得出更暗"的亮度
        // 0.5.9  搜索从 5000 起按亮度折半下降，看不出就减半，看得出再二分回升
        // 0.5.10 改回标准二分：首问 5000，之后一律取区间中点，不再翻倍跳到 10000
        // 0.5.11 阶梯加密到 462 档（1% 一档），二分收敛到真值 1% 以内
        // 0.6.0  HDR 测试页重做界面：峰值测量为主
        // 0.6.1  阶梯保留（只留八档全高那一版），通过底部按钮切换；去掉半高/单档
        // 0.6.2  测试页排版收紧：内容区占大块，按钮改胶囊尺寸，阶梯模式隐藏答题行
        // 0.6.3  控制条改圆角卡片，处理系统栏 insets，按钮不再被小白条压住
        // 0.6.4  控制区缩成左下角小卡片，色块占满整屏
        // 0.6.5  去掉两块之间的 2px 黑色分隔条
        // 0.7.0  HDR 测试改为原生 EGL/PQ 渲染：任意亮度、面积精确，删掉全部测试片
        // 0.7.1  新增全屏网格模式：两档亮度交错铺满，用于测全屏上限
        // 0.7.2  模式改名峰值/全局/黑位/阶梯，并加入黑位测量
        // 0.7.3  HDR 三元组存档：5 个槽位，单项测量分别写入；设置页可查看系统报告与槽位
        // 0.7.4  PQ 初始化带失败码；色彩空间改为创建 surface 时申请；10-bit 配置不再要求 alpha
        // 0.7.5  峰值改为一对方块紧贴（无中缝）
        // 0.7.6  四项改成常驻分段按钮（峰值/全局/黑位/阶梯），当前项高亮，不再靠循环切换
        // 0.7.7  去掉阶梯；按钮上三下三对齐；显示不再避让摄像头；存档顺序改峰值/黑位/全局；默认竖屏可横屏
        // 0.7.8  采用→保存且不退出；全局测完转计时看掉亮度；手动峰值改为选择安卓预设或槽位
        // 0.7.9  计时保存不足 1 秒按 1 秒记（0 会被当成未测）；底部保存也写入计时
        // 0.7.10 修中文存档行缺第 5 个占位符（看不见维持时长）；计时模式记录 HDR/SDR 比值曲线
        // 0.7.11 比值不进存档，改为实测时在右上角画比值-时间曲线
        // 0.7.12 曲线同时采样亮度，画真正在变的那条；两者都不变时直说
        // 0.7.13 曲线只画比值（x=采样序号，y=比值），断点表示读不到；图上标出当前值与样本数
        // 0.7.14 曲线改圆角卡片、去掉 xx/xx 计数；比值一开始下降就自动锁定并写入保持时长
        // 0.7.15 曲线上不再写任何文字（比值已在显示内容里），只保留形状
        // 0.7.16 状态行显示 当前/最高 比值；系统开始压缩时转琥珀色并标明测量不可信
        // 0.7.17 最高比值改用 getHighestHdrSdrRatio（API 36），不再靠“见过的最大值”猜
        // 0.7.18 压缩判定改用近 60 秒的平台值，避免拿室内读数与阳光下的上限比较造成误报
        // 0.7.19 峰值测完后按当前比值推算出 SDR 白点，便于核对比值与实测是否自洽
        // 1.0.0  首个正式版
        versionName "0.7.19"
        versionCode = 719

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.limelight.moonbeam.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.limelight.moonbeam"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Moonbeam (Debug)"
            resValue "string", "app_label_root", "Moonbeam (Root Debug)"
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix ".unofficial"
            resValue "string", "app_label", "Moonbeam"
            resValue "string", "app_label_root", "Moonbeam (Root)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
